[package]
name = "skri-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writer Studio desktop UI (Tauri 2): кнопкові пресети-напрямки, каталог моделей, біблія, алерти"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skri-core = { path = "../../crates/skri-core" }
