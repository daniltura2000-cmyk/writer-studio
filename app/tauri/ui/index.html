<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Writer Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Попередження: запуск поза Tauri -->
  <div id="noInvoke" class="hidden"></div>

  <!-- ============ ОНБОРДІНГ-МАЙСТЕР (перший запуск) ============ -->
  <div id="wizard" class="overlay hidden">
    <div class="wizard">
      <!-- Крок 1: що пишеш -->
      <div class="wiz-step active" data-step="1">
        <h2 data-i18n="wiz_q"></h2>
        <div class="sub" data-i18n="wiz_sub"></div>
        <div class="wiz-cards" id="wizCards"></div>
      </div>
      <!-- Крок 2: мова інтерфейсу -->
      <div class="wiz-step" data-step="2">
        <h2 data-i18n="wiz_lang_q"></h2>
        <div class="sub" data-i18n="wiz_lang_sub"></div>
        <div class="wiz-lang" id="wizLangs"></div>
        <div class="wiz-footer">
          <button id="wizBack" class="ghost" data-i18n="btn_back"></button>
        </div>
      </div>
      <!-- Крок 3: готово -->
      <div class="wiz-step" data-step="3">
        <div class="wiz-done">
          <div class="big">🎉</div>
          <h2 data-i18n="wiz_done_t"></h2>
          <p data-i18n="wiz_done_d"></p>
          <button id="wizFinish" class="primary" data-i18n="wiz_finish"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ ВИБІР/СТВОРЕННЯ ПРОЄКТУ ============ -->
  <div id="setup" class="overlay hidden">
    <div class="setup-card">
      <h2 data-i18n="setup_t"></h2>
      <div class="sub" data-i18n="setup_sub"></div>
      <input id="setupRoot" type="text" data-i18n-ph="setup_ph">
      <label class="fieldline"><span data-i18n="setup_preset"></span>
        <select id="setupPreset"></select>
      </label>
      <div class="row">
        <button id="setupOpen" class="primary" data-i18n="setup_open"></button>
        <button id="setupCreate" data-i18n="setup_create"></button>
      </div>
      <div id="setupMsg" class="note"></div>
    </div>
  </div>

  <!-- ============ ШАПКА ============ -->
  <header>
    <div class="head-row">
      <div class="brand"><span class="logo">✒️</span><h1>Writer Studio</h1></div>
      <div class="projbar">
        <input id="projRoot" type="text" data-i18n-ph="proj_ph">
        <button id="openProj" class="compact" data-i18n="open"></button>
        <span id="projState" class="proj-state"></span>
      </div>
      <div class="head-tools">
        <label class="fieldline" style="margin:0">
          <select id="langSel" title="Language / Мова / Язык" aria-label="Language">
            <option value="uk">Українська</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <button id="themeBtn" class="compact" aria-label="Theme">🌙</button>
        <button id="btnCheck" class="primary" data-i18n="check"></button>
      </div>
    </div>
    <div class="head-hint" data-i18n="check_hint"></div>
  </header>

  <!-- ============ ВКЛАДКИ РІВНЯ 1 ============ -->
  <nav>
    <button class="tab active" data-tab="studio" data-i18n="tab_studio"></button>
    <button class="tab" data-tab="start" data-i18n="tab_start"></button>
    <button class="tab" data-tab="models" data-i18n="tab_models"></button>
  </nav>

  <main>
    <!-- ГОЛОВНИЙ РОБОЧИЙ ЕКРАН -->
    <section id="studio" class="screen active studio">
      <aside id="side">
        <div class="side-tabs">
          <button class="stab active" data-stab="chapters" data-i18n="t_chapters"></button>
          <button class="stab" data-stab="bible" data-i18n="t_bible"></button>
          <button class="stab" data-stab="alerts" data-i18n="t_alerts"></button><span id="alertBadge" class="badge-n" hidden></span>
          <button class="stab" data-stab="release" data-i18n="t_release"></button>
        </div>

        <!-- Глави -->
        <div id="stab-chapters" class="stabpane active">
          <div class="pane-head">
            <h3 data-i18n="t_chapters"></h3>
            <div class="pane-sub" data-i18n="chapters_sub"></div>
          </div>
          <div class="row">
            <button id="btnNewDoc" class="primary" data-i18n="btn_new_chapter"></button>
            <button id="btnReloadDocs" data-i18n="btn_refresh"></button>
          </div>
          <div id="docList" class="doclist"></div>
        </div>

        <!-- Персонажі та світ (біблія) -->
        <div id="stab-bible" class="stabpane">
          <div class="pane-head">
            <h3 data-i18n="t_bible"></h3>
            <div class="pane-sub" data-i18n="bible_sub"></div>
          </div>
          <div class="row"><button id="btnIndex" class="compact" data-i18n="btn_rescan"></button></div>
          <div id="cards" class="cards-stacked"></div>
        </div>

        <!-- Знайдені проблеми (алерти) -->
        <div id="stab-alerts" class="stabpane">
          <div class="pane-head">
            <h3 data-i18n="t_alerts"></h3>
            <div class="pane-sub" data-i18n="alerts_sub"></div>
          </div>
          <div class="row">
            <select id="alertFilter"></select>
          </div>
          <div id="alertsSummary" class="note"></div>
          <div id="alertList" class="alertlist"></div>
          <details class="tools">
            <summary data-i18n="dlg_tools"></summary>
            <div class="row">
              <button id="btnVars" class="compact" data-i18n="btn_vars"></button>
              <button id="btnBarks" class="compact" data-i18n="btn_barks"></button>
            </div>
            <div id="varsOut"></div>
            <div id="barksOut"></div>
            <div class="row">
              <input id="epPath" type="text" data-i18n-ph="ep_ph">
              <button id="btnEpisode" class="compact" data-i18n="btn_episode"></button>
            </div>
            <div id="epOut"></div>
          </details>
        </div>

        <!-- Публікації (реліз) -->
        <div id="stab-release" class="stabpane">
          <div class="pane-head">
            <h3 data-i18n="t_release"></h3>
            <div class="pane-sub" data-i18n="release_sub"></div>
          </div>
          <div id="forecastBox" class="forecast"></div>
          <div id="kanban" class="kanban"></div>
        </div>
      </aside>

      <section id="editorPane">
        <div id="editorHead">
          <span id="docTitle"></span>
          <span id="docMeta" class="note"></span>
        </div>
        <div id="editorEmpty">
          <div class="big">📖</div>
          <div class="t1" data-i18n="ed_empty_t"></div>
          <div class="t2" data-i18n="ed_empty_d"></div>
        </div>
        <textarea id="editor" spellcheck="false" data-i18n-ph="ed_ph"></textarea>
        <div id="statusbar">
          <span id="cntWords"></span>
          <span id="saveState" class="note"></span>
          <span class="spacer"></span>
          <button id="btnSave" class="primary compact" data-i18n="save"></button>
        </div>
      </section>
    </section>

    <!-- ПОЧАТОК РОБОТИ: той самий майстер, доступний у будь-який момент -->
    <section id="start" class="screen page">
      <h2 data-i18n="start_t"></h2>
      <div class="sub" data-i18n="start_sub"></div>
      <button id="startWizard" class="primary" data-i18n="start_btn"></button>
    </section>

    <!-- МОДЕЛІ -->
    <section id="models" class="screen page">
      <h2 data-i18n="models_t"></h2>
      <div class="sub" data-i18n="models_sub"></div>
      <div class="grid" id="tasks"></div>
      <div class="opts" id="panel">
        <h3 data-i18n="pick_task"></h3>
        <div class="hint" data-i18n="pick_task_hint"></div>
      </div>
      <details class="ollama">
        <summary data-i18n="ollama_t"></summary>
        <p data-i18n="ollama_d"></p>
      </details>
      <details class="tech">
        <summary data-i18n="tech_t"></summary>
        <div class="json" id="modelOut"></div>
        <div class="note" data-i18n="tech_note"></div>
      </details>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
